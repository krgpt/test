name: Deploy to GitHub Pages

# main 브랜치에 푸시될 때마다 사이트를 배포합니다.
# 빌드 과정이 없는 정적 사이트라 저장소 내용을 그대로 올립니다.

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 실행은 취소하지 않고 큐에 둡니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정 (미설정 시 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 사이트 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
